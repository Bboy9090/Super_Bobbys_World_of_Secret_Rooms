name: Codex APK Build
on:
  push:
    branches:
      - 'codex/apk-build-2026-08-23'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android .
      - run: mkdir -p assets/images assets/icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter build apk --debug
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Super-Bobbys-World-Diagnostic-debug-APK
          path: |
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
            mobile_app/APK-SHA256.txt
          retention-days: 30
