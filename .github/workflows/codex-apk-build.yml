name: Codex APK Build
concurrency:
  group: super-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - 'codex/apk-build-2026-08-23'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android .
      - name: Pin Android compile SDK for plugin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          path.write_text(text)
          PY
      - name: Compile all Android plugin modules against API 36
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.library")) {
                      extensions.configure<com.android.build.gradle.LibraryExtension> {
                          compileSdk = 36
                      }
                  }
              }
          }
          EOF
      - run: mkdir -p assets/images assets/icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter build apk --debug
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Super-Bobbys-World-Diagnostic-debug-APK
          path: |
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
            mobile_app/APK-SHA256.txt
          retention-days: 30
