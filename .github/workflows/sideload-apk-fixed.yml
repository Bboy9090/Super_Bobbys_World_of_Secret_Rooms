name: Sideload APK
on:
  push:
    branches: [artifact/sideload-apk-fixed-20261101]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.bobbysworld --project-name diagnostic_repair_app .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Raise legacy plugin compileSdk for current AndroidX metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          touched = []
          for name in ("device_info_plus-", "battery_plus-", "mobile_scanner-"):
              for package in root.glob(name + "*"):
                  for gradle in (package / "android").glob("build.gradle*"):
                      text = gradle.read_text()
                      updated = re.sub(r"compileSdk(?:Version)?\s*[= ]\s*33\b", "compileSdk = 36", text)
                      updated = re.sub(r"compileSdk(?:Version)?\s+33\b", "compileSdk 36", updated)
                      if updated != text:
                          gradle.write_text(updated)
                          touched.append(str(gradle))
          print("\n".join(touched))
          PY
      - name: Build installable debug APK
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk Super-Bobbys-World-sideload.apk
          sha256sum Super-Bobbys-World-sideload.apk > Super-Bobbys-World-sideload.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: super-bobbys-world-sideload-apk
          path: |
            mobile_app/Super-Bobbys-World-sideload.apk
            mobile_app/Super-Bobbys-World-sideload.sha256
          if-no-files-found: error
