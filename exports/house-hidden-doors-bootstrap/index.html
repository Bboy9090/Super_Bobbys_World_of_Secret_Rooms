<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bobby's House of Hidden Doors</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Bobby's Workshop presents</p>
      <h1>Bobby's House of Hidden Doors</h1>
      <p>Every room is hiding something.</p>
    </header>

    <nav aria-label="Game controls">
      <button id="new-game" type="button">New Game</button>
      <button id="save" type="button">Save</button>
      <button id="load" type="button">Load</button>
    </nav>

    <p id="status" role="status" aria-live="polite"></p>
    <article id="game" aria-label="Current room"></article>
  </main>

  <script type="module" src="./src/browserApp.mjs"></script>
</body>
</html>
